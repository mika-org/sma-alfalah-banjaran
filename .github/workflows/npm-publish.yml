name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            cd /var/www/html/sma-alfalah-banjaran

            git pull origin main

            STORAGE_ROOT=/var/www/storage-alfalah
            mkdir -p "$STORAGE_ROOT/uploads"
            if [ ! -w "$STORAGE_ROOT/uploads" ]; then
              echo "Storage is not writable by $(id -un). Run: sudo chown -R $(id -un):www-data $STORAGE_ROOT"
              exit 1
            fi

            # Preserve legacy tracked uploads without overwriting newer VPS files.
            if [ -d public/storage ]; then
              cp -an public/storage/. "$STORAGE_ROOT/"
            fi

            npm ci

            npx prisma migrate deploy

            npm run build

            if pm2 describe alfalah > /dev/null 2>&1; then
              PORT=3006 pm2 restart alfalah --update-env
            else
              PORT=3006 pm2 start npm --name alfalah -- start
            fi

            pm2 save

      - name: Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          TOTAL=$((END_TIME - START_TIME))

          HOURS=$((TOTAL / 3600))
          MINUTES=$(((TOTAL % 3600) / 60))
          SECONDS=$((TOTAL % 60))

          if [ $HOURS -gt 0 ]; then
            DURATION="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ $MINUTES -gt 0 ]; then
            DURATION="${MINUTES}m ${SECONDS}s"
          else
            DURATION="${SECONDS}s"
          fi

          echo "DURATION=$DURATION" >> $GITHUB_ENV
          echo "FINISHED=$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')" >> $GITHUB_ENV

      - name: Telegram Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Deploy Notification*

            ✅ *Deploy Successful*

            📦 *Repository:* `${{ github.repository }}`
            🌿 *Branch:* `${{ github.ref_name }}`
            👤 *Committer:* `${{ github.actor }}`

            📝 *Commit:*
            `${{ github.event.head_commit.message }}`

            🔗 *Commit:*
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            🖥 *Server:*
            `${{ secrets.VPS_HOST }}`

            🌐 *Application Port:* `3006`
            🌐 *Application Link:* `https://alfalah.elevore.web.id`

            🕒 *Finished:* `${{ env.FINISHED }}`
            ⏱ *Duration:* `${{ env.DURATION }}`

            🚀 *Status:* ✅ SUCCESS

      - name: Telegram Failed Notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Deploy Notification*

            ❌ *Deploy Failed*

            📦 *Repository:* `${{ github.repository }}`
            🌿 *Branch:* `${{ github.ref_name }}`
            👤 *Committer:* `${{ github.actor }}`

            📝 *Commit:*
            `${{ github.event.head_commit.message }}`

            🔗 *Commit:*
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            🖥 *Server:*
            `${{ secrets.VPS_HOST }}`

            🌐 *Application Port:* `3006`

            🕒 *Finished:* `${{ env.FINISHED }}`
            ⏱ *Duration:* `${{ env.DURATION }}`

            🚨 *Status:* ❌ FAILED

            👉 *Check GitHub Actions:*
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
